name: Automatisation
on:
  schedule:
    - cron: "17 * * * *"   # filet de sécurité : relance la boucle si elle s'est arrêtée
  push:
    branches: [main]
    paths: [data.json]
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notification de test (passage unique)"
        type: boolean
        default: false
      recheck:
        description: "Recalculer les liens d'un match (clé), sans rien écrire (passage unique)"
        type: string
        default: ""
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Boucle déjà active ?
        id: busy
        run: |
          # La boucle précédente se relance juste avant de s'arrêter : on lui laisse 2 min pour finir
          for i in $(seq 1 12); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/automate.yml/runs?status=in_progress" --jq "[.workflow_runs[]|select(.id < $GITHUB_RUN_ID)]|length")
            [ "$n" = "0" ] && break; sleep 10
          done
          echo "other=$n" >> "$GITHUB_OUTPUT"; echo "autres passages actifs : $n"
      - uses: actions/checkout@v5
        if: steps.busy.outputs.other == '0' || inputs.test || inputs.recheck != ''
      - uses: actions/setup-node@v5
        if: steps.busy.outputs.other == '0' || inputs.test || inputs.recheck != ''
        with:
          node-version: 22
      - name: Dépendances
        if: steps.busy.outputs.other == '0' || inputs.test || inputs.recheck != ''
        run: npm install --no-save --prefix .github/notify firebase-admin@12 && ln -s ../notify/node_modules .github/engine/node_modules
      - name: Passage unique (test ou contrôle)
        if: inputs.test || inputs.recheck != ''
        env:
          NOTIFY_TEST: ${{ inputs.test }}
          ENGINE_RECHECK: ${{ inputs.recheck }}
        run: |
          if [ -n "$ENGINE_RECHECK" ]; then node .github/engine/engine.mjs; fi
          if [ "$NOTIFY_TEST" = "true" ]; then node .github/notify/notify.mjs; fi
      - name: Boucle (matchs, liens, notifications)
        if: steps.busy.outputs.other == '0' && !inputs.test && inputs.recheck == ''
        run: .github/engine/loop.sh
