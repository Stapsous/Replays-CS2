name: Notifications
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths: [data.json]
  workflow_dispatch:
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --prefix .github/notify firebase-admin@12
      - run: node .github/notify/notify.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
